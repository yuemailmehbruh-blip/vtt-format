<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rolls</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12151c;
      --panel: #1b2030;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #6ea8fe;
      --border: #2c3448;
      --ok: #7ddea5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.85rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .head strong { flex: 1; font-size: 1rem; }
    .body {
      flex: 1;
      overflow: auto;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-height: 0;
    }
    .section {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
      background: var(--panel);
    }
    .section h3 {
      margin: 0 0 0.55rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .fields {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
    }
    .fields label {
      font-size: 0.78rem;
      color: var(--muted);
      user-select: none;
    }
    .fields input[type="number"] {
      width: 4.2rem;
      padding: 0.35rem 0.45rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    button.primary {
      background: #2a4a7a;
      color: var(--text);
      border: 1px solid #3d6cb0;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }
    button.primary:hover { filter: brightness(1.08); }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.65rem;
      cursor: pointer;
      font: inherit;
      font-size: 0.8rem;
    }
    button.ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .history-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 140px;
      padding: 0;
      overflow: hidden;
    }
    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .history-head h3 { margin: 0; }
    #roll-history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.55rem 0.85rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.85rem;
    }
    .roll-line {
      color: var(--text);
      line-height: 1.35;
      word-break: break-word;
    }
    .roll-line .roll-val {
      color: var(--ok);
      font-weight: 700;
    }
    .roll-empty {
      color: var(--muted);
      font-size: 0.8rem;
      font-style: italic;
    }
    .actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.55rem 0.85rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    #status { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="head"><strong>Rolls</strong></div>
  <div class="body">
    <div class="section">
      <h3>Dice roll</h3>
      <div class="fields">
        <label for="die-sides">1–</label>
        <input type="number" id="die-sides" min="1" step="1" value="20" />
        <button type="button" class="primary" id="btn-die-roll">Roll</button>
      </div>
    </div>
    <div class="section">
      <h3>Bell curve sample</h3>
      <div class="fields">
        <label for="bell-mean">μ</label>
        <input type="number" id="bell-mean" step="any" value="10" />
        <label for="bell-stdev">σ</label>
        <input type="number" id="bell-stdev" min="0.0001" step="any" value="3" />
        <button type="button" class="primary" id="btn-bell-sample">Sample</button>
      </div>
    </div>
    <div class="section history-section">
      <div class="history-head">
        <h3>Session history</h3>
        <button type="button" class="ghost" id="btn-roll-clear" title="Clear this session's rolls">Clear</button>
      </div>
      <div id="roll-history-list" aria-live="polite">
        <div class="roll-empty">No rolls yet</div>
      </div>
    </div>
  </div>
  <div class="actions">
    <span id="status"></span>
  </div>
  <script src="/rolls.js"></script>
</body>
</html>
