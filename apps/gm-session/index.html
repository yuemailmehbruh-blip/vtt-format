<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GM Session (offline)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12151c;
      --panel: #1b2030;
      --panel-2: #151a26;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #6ea8fe;
      --border: #2c3448;
      --ok: #7ddea5;
      --sidebar-w: 260px;
      --sheet-w: 320px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.55rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      min-height: 48px;
    }
    header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
    }
    header .badge {
      font-size: 0.75rem;
      color: var(--ok);
      border: 1px solid rgba(125, 222, 165, 0.35);
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }
    header .meta { color: var(--muted); font-size: 0.85rem; }
    header .hint {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.8rem;
    }
    #status { color: var(--accent); font-size: 0.85rem; }
    #layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr var(--sheet-w);
      height: calc(100% - 48px);
    }
    #layout.no-sheet {
      grid-template-columns: var(--sidebar-w) 1fr;
    }
    #library {
      background: var(--panel-2);
      border-right: 1px solid var(--border);
      overflow: auto;
      padding: 0.75rem 0.6rem 1rem;
    }
    #library h2 {
      margin: 0.4rem 0 0.5rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
    }
    #library h2:first-child { margin-top: 0; }
    .lib-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.5rem;
      margin-bottom: 0.25rem;
      border-radius: 6px;
      border: 1px solid transparent;
      background: var(--panel);
      cursor: grab;
      user-select: none;
    }
    .lib-item:hover { border-color: var(--border); }
    .lib-item.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(110, 168, 254, 0.25);
    }
    .lib-item .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #c8d0e0;
      flex-shrink: 0;
    }
    .lib-item .name { flex: 1; min-width: 0; }
    .lib-item .name strong {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lib-item .name span {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .lib-item .sheet-flag {
      font-size: 0.65rem;
      color: var(--ok);
      border: 1px solid rgba(125, 222, 165, 0.3);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .scene-item {
      padding: 0.4rem 0.5rem;
      margin-bottom: 0.2rem;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      border: 1px solid transparent;
    }
    .scene-item:hover { background: var(--panel); color: var(--text); }
    .scene-item.active {
      background: var(--panel);
      color: var(--text);
      border-color: var(--border);
    }
    #viewport {
      position: relative;
      overflow: hidden;
      cursor: grab;
      background:
        radial-gradient(ellipse at center, #1a2233 0%, #0d1016 70%);
    }
    #viewport.dragging { cursor: grabbing; }
    #viewport.drop-target {
      outline: 2px dashed var(--accent);
      outline-offset: -4px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #sheet-panel {
      background: var(--panel-2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #sheet-panel.hidden { display: none; }
    #sheet-panel .sheet-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    #sheet-panel .sheet-head strong { flex: 1; font-size: 0.9rem; }
    #sheet-panel .sheet-path {
      padding: 0.35rem 0.75rem;
      font-size: 0.7rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }
    #sheet-text {
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 0.75rem;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
    }
    #sheet-panel .sheet-actions {
      display: flex;
      gap: 0.5rem;
      padding: 0.55rem 0.75rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    button {
      background: #24304a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      font: inherit;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: #2a4a7a;
      border-color: #3d6cb0;
    }
    button.ghost { background: transparent; }
    @media (max-width: 900px) {
      #layout { grid-template-columns: 200px 1fr; }
      #sheet-panel { display: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="scene-name">Loading…</h1>
    <span class="badge">GM Session (offline)</span>
    <span class="meta" id="scene-meta"></span>
    <span id="status"></span>
    <span class="hint">Drag actors onto map · Drag map to pan · Wheel zoom · Dbl-click fit</span>
  </header>
  <div id="layout">
    <aside id="library">
      <h2>Characters / Actors</h2>
      <div id="actor-list"></div>
      <h2>Scenes</h2>
      <div id="scene-list"></div>
    </aside>
    <div id="viewport">
      <canvas id="map"></canvas>
    </div>
    <aside id="sheet-panel" class="hidden">
      <div class="sheet-head">
        <strong id="sheet-title">Sheet</strong>
        <button type="button" class="ghost" id="sheet-close" title="Close">✕</button>
      </div>
      <div class="sheet-path" id="sheet-path"></div>
      <textarea id="sheet-text" spellcheck="false"></textarea>
      <div class="sheet-actions">
        <button type="button" class="primary" id="sheet-save">Save to disk</button>
        <span id="sheet-save-status" class="meta"></span>
      </div>
    </aside>
  </div>
  <script src="/session.js"></script>
</body>
</html>
