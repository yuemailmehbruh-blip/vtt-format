<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Character Sheet</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12151c;
      --panel: #1b2030;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #6ea8fe;
      --border: #2c3448;
      --ok: #7ddea5;
      --btn: #c9a0ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.85rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .head strong { flex: 1; font-size: 1rem; }
    .tabs {
      display: flex;
      gap: 0.25rem;
      padding: 0.4rem 0.85rem 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .tabs button {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
      font: inherit;
      margin-bottom: -1px;
    }
    .tabs button:hover { color: var(--text); }
    .tabs button.active {
      color: var(--text);
      background: var(--bg);
      border-color: var(--border);
      border-bottom-color: var(--bg);
    }
    .path {
      padding: 0.4rem 0.85rem;
      font-size: 0.72rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }
    .panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .panel.active { display: flex; }

    #sheet-visual-wrap {
      flex: 1;
      min-height: 180px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(44,52,72,0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(44,52,72,0.35) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    #sheet-svg { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; touch-action: none; }
    .widget-box { fill: #243049; stroke: var(--accent); stroke-width: 2; }
    .widget-circle { fill: #243049; stroke: var(--ok); stroke-width: 2; }
    .widget-button { fill: #3a2f55; stroke: var(--btn); stroke-width: 2; cursor: pointer; }
    .widget-button:hover { filter: brightness(1.12); }
    .widget-button.toggle-on { fill: #5a3d8a; stroke: #e8c07d; stroke-width: 3; }
    .widget-label { fill: var(--text); font-size: 11px; text-anchor: middle; pointer-events: none; }
    .widget-value {
      fill: var(--accent);
      font-size: 16px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .widget-value.formula { fill: var(--ok); }
    .widget-value.dual-display { pointer-events: auto; cursor: pointer; }
    foreignObject input.field-edit-dual {
      font: 700 16px/1 system-ui, sans-serif;
      color: var(--accent);
      background: rgba(0, 0, 0, 0.35);
      border-radius: 4px;
    }
    .widget-btn-label {
      fill: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .widget-btn-sub { fill: var(--muted); font-size: 10px; text-anchor: middle; pointer-events: none; }
    foreignObject input.field-edit {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      color: var(--accent);
      font: 700 16px/1 system-ui, sans-serif;
      text-align: center;
      outline: none;
      padding: 0;
    }
    foreignObject input.field-edit-base {
      font: 600 11px/1 system-ui, sans-serif;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.25);
      border-radius: 4px;
    }

    #roll-toast {
      position: absolute;
      right: 0.75rem;
      bottom: 0.75rem;
      background: rgba(27, 32, 48, 0.95);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      color: var(--ok);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 5;
    }
    #roll-toast.show { opacity: 1; }

    .notes-block {
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      max-height: 38%;
      min-height: 6rem;
      flex-shrink: 0;
    }
    .notes-block summary {
      cursor: pointer;
      padding: 0.4rem 0.85rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      list-style: none;
      user-select: none;
    }
    .notes-block summary::-webkit-details-marker { display: none; }
    .notes-block[open] { max-height: 45%; }
    #sheet-text {
      flex: 1;
      width: 100%;
      border: 0;
      resize: none;
      background: var(--bg);
      color: var(--text);
      padding: 0.65rem 0.85rem;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
      min-height: 4rem;
    }


    .mechanics-body {
      flex: 1;
      overflow: auto;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 0;
    }
    .mech-empty {
      margin: 0.5rem 0;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .mech-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .mech-import-panel {
      display: none;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border, #2a3142);
      border-radius: 8px;
      background: rgba(0,0,0,0.2);
      margin-bottom: 0.35rem;
    }
    .mech-import-panel.open { display: flex; }
    .mech-import-panel label {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .mech-import-panel select {
      max-width: 100%;
      padding: 0.35rem 0.45rem;
      border-radius: 6px;
      border: 1px solid var(--border, #2a3142);
      background: var(--bg, #12151c);
      color: var(--text);
    }
    .mech-import-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .mech-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    .mech-row .mech-name {
      flex: 1;
      font-weight: 600;
      font-size: 0.9rem;
      word-break: break-word;
    }
    .mech-row button {
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      font: inherit;
    }
    .mech-row button:hover { border-color: var(--accent); color: var(--accent); }
    .mech-row button.mech-trigger {
      background: #3a2f55;
      border-color: var(--btn);
      color: var(--text);
    }
    .mech-row button.mech-trigger:hover { filter: brightness(1.1); color: var(--text); }
    .mech-row button.mech-toggle {
      background: #243049;
      border-color: var(--accent);
      min-width: 4.5rem;
    }
    .mech-row button.mech-toggle.toggle-on {
      background: #5a3d8a;
      border-color: #e8c07d;
      color: var(--text);
    }
    #mechanics-status { color: var(--muted); font-size: 0.8rem; }

    .appearance-body {
      flex: 1;
      overflow: auto;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .section {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
      background: var(--panel);
    }
    .section h3 { margin: 0 0 0.55rem; font-size: 0.85rem; font-weight: 600; }
    .section.stub { opacity: 0.72; }
    .section.stub .coming { margin: 0; font-size: 0.78rem; color: var(--muted); }
    .field { display: flex; flex-direction: column; gap: 0.3rem; max-width: 220px; }
    .field label { font-size: 0.78rem; color: var(--muted); }
    .field input[type="number"] {
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .field .hint { font-size: 0.72rem; color: var(--muted); }
    .actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.55rem 0.85rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    button.primary {
      background: #2a4a7a;
      color: var(--text);
      border: 1px solid #3d6cb0;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font: inherit;
    }
    button.primary:hover { filter: brightness(1.08); }
    #status, #appearance-status, #mechanics-status { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="head"><strong id="title">Sheet</strong></div>
  <div class="tabs" role="tablist">
    <button type="button" class="active" data-tab="sheet" role="tab" aria-selected="true">Sheet</button>
    <button type="button" data-tab="mechanics" role="tab" aria-selected="false">Mechanics</button>
    <button type="button" data-tab="appearance" role="tab" aria-selected="false">Appearance</button>
  </div>
  <div class="path" id="path"></div>

  <div class="panel active" id="panel-sheet" role="tabpanel">
    <div id="sheet-visual-wrap">
      <svg id="sheet-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="roll-toast"></div>
    </div>
    <details class="notes-block" id="notes-block">
      <summary>Notes (text doc)</summary>
      <textarea id="sheet-text" spellcheck="false"></textarea>
    </details>
    <div class="actions">
      <button type="button" class="primary" id="save">Save notes</button>
      <span id="status"></span>
    </div>
  </div>


  <div class="panel" id="panel-mechanics" role="tabpanel">
    <div class="mechanics-body">
      <div class="mech-toolbar">
        <button type="button" id="btn-mech-import">Import…</button>
      </div>
      <div class="mech-import-panel" id="mech-import-panel" hidden>
        <label for="mech-import-select">Campaign mechanics library</label>
        <select id="mech-import-select" size="6"></select>
        <div class="mech-import-actions">
          <button type="button" class="primary" id="btn-mech-import-confirm">Import</button>
          <button type="button" id="btn-mech-import-cancel">Cancel</button>
        </div>
        <p class="mech-empty" id="mech-import-hint" hidden></p>
      </div>
      <div id="mechanics-list"></div>
    </div>
    <div class="actions">
      <span id="mechanics-status"></span>
    </div>
  </div>

  <div class="panel" id="panel-appearance" role="tabpanel">
    <div class="appearance-body">
      <div class="section">
        <h3>Token size</h3>
        <div class="field">
          <label for="size-tiles">Tiles across (diameter)</label>
          <input type="number" id="size-tiles" min="0.25" step="0.25" value="1" />
          <span class="hint">Circle diameter in map tiles. Default 1.</span>
        </div>
      </div>
      <div class="section stub">
        <h3>Token graphic</h3>
        <p class="coming">Coming soon</p>
      </div>
      <div class="section stub">
        <h3>Auras / emanations</h3>
        <p class="coming">Coming soon</p>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="save-appearance">Save appearance</button>
      <span id="appearance-status"></span>
    </div>
  </div>

  <script src="/sheet-runtime.js"></script>
  <script src="/sheet.js"></script>
</body>
</html>
