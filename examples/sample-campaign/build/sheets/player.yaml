# Player character sheet — declarative fields + closed formulas.
# Permissions: players see/edit own sheet fields marked player_visible / player_editable.
# GM sees all. Formulas are closed (no arbitrary code); only named ops over sheet fields.
# Optional layout: from sheet builder (future play renderer; not used by play yet).
id: player
name: Player Character
permissions:
  notes: |
    - player_visible: shown to owning player
    - player_editable: owning player may change
    - gm_only: GM/runtime only
    - formula fields are read-only for everyone except recomputation

fields:
  name:
    type: string
    visibility: player_visible
    editable: player_editable
    default: ""

  hp_current:
    type: integer
    visibility: player_visible
    editable: player_editable
    default: 10

  hp_max:
    type: integer
    visibility: player_visible
    editable: player_editable
    default: 10

  STR:
    type: integer
    visibility: player_visible
    editable: player_editable
    default: 10

  DEX:
    type: integer
    visibility: player_visible
    editable: player_editable
    default: 10

  CON:
    type: integer
    visibility: player_visible
    editable: player_editable
    default: 10

  INT:
    type: integer
    visibility: player_visible
    editable: player_editable
    default: 10

  WIS:
    type: integer
    visibility: player_visible
    editable: player_editable
    default: 10

  CHA:
    type: integer
    visibility: player_visible
    editable: player_editable
    default: 10

  STR_mod:
    type: integer
    visibility: player_visible
    editable: false
    formula: "floor((STR - 10) / 2)"
    notes: Closed formula over STR; recomputed when STR changes.

  AC:
    type: integer
    visibility: player_visible
    editable: player_editable
    default: 10

  notes:
    type: text
    visibility: player_visible
    editable: player_editable
    default: ""

layout:
  widgets:
    - id: w_str
      shape: box
      field: STR
      x: 40
      y: 40
      w: 72
      h: 56
    - id: w_str_mod
      shape: circle
      field: STR_mod
      x: 160
      y: 36
      w: 64
      h: 64
    - id: w_hp
      shape: box
      field: hp_current
      x: 40
      y: 140
      w: 72
      h: 56
    - id: w_roll_d20
      shape: button
      label: Attack
      action:
        type: roll
        sides: 20
      x: 260
      y: 40
      w: 88
      h: 44
